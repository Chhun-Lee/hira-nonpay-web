# 상시 실행하는 조회 API 서버. active 스냅샷만 읽는다.
spring:
  mvc:
    problemdetails:
      # 오류 응답을 RFC 9457 형식(application/problem+json)으로
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

kakao:
  map:
    # 카카오맵 JavaScript 키. 브라우저에 노출되는 키라 Kakao Developers에 등록한 사이트 도메인에서만 동작한다.
    js-key: ${KAKAO_MAP_KEY}

ui:
  # 첫 화면에서 고를 시군구(전국 데이터가 들어오면 가나다순 첫 지역이 강원이 되므로 정해 둔다). 110001 = 서울 강남구
  default-sggu-cd: 110001

noncovered:
  # 비급여 항목 빠른 선택 버튼(이 순서대로). 가격 공개 병원이 많은 진료 항목 위주로 골랐다(2026-10-03 기준).
  featured-items:
    - { code: MX1220000, label: 도수치료 }
    - { code: ABZ010001, label: 1인실 }
    - { code: SZ0840000, label: 체외충격파 }
    - { code: EB4140000, label: 갑상선 초음파 }
    - { code: HE1110000, label: 허리 MRI }
    - { code: HE1200000, label: 무릎 MRI }
    - { code: 3Z5200303, label: 대상포진 백신 }
    - { code: PDZ010000, label: 일반 진단서 }
  # 의원급 비급여 가격은 Open API에 없어 심평원 누리집 화면으로 안내한다.
  # "비급여 진료비용 정보" 화면(병·의원으로 조회하기). 2026-10-05 브라우저로 확인
  hira-nonpay-url: https://www.hira.or.kr/npay/index.do?pgmid=HIRAA030009000000
