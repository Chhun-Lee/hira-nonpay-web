# 상시 실행하는 조회 API 서버. active 스냅샷만 읽는다.
spring:
  mvc:
    problemdetails:
      # 오류 응답을 RFC 9457 형식(application/problem+json)으로
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

kakao:
  map:
    # 카카오맵 JavaScript 키. 브라우저에 노출되는 키라 Kakao Developers에 등록한 사이트 도메인에서만 동작한다.
    js-key: ${KAKAO_MAP_KEY}
