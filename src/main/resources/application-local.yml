# 로컬 개발. api 또는 collector와 함께 켠다.
# 비밀값은 실행 환경변수로 넣는다(인텔리제이 Run Configuration 등).
#   HIRA_SERVICE_KEY   공공데이터포털 일반 인증키(Decoding). 클라이언트가 인코딩하므로 Encoding 키를 넣으면 이중 인코딩된다.
#   DB_PASSWORD        로컬 MySQL 사용자 비밀번호(compose.yaml)
#   DB_ROOT_PASSWORD   로컬 MySQL root 비밀번호(compose.yaml)
# DB_NAME, DB_USERNAME, DB_PORT는 compose.yaml에 기본값이 있다.
spring:
  docker:
    compose:
      # bootRun을 끝내도 MySQL은 계속 띄워 둔다(수집 → 조회를 번갈아 실행).
      lifecycle-management: start-only

logging:
  level:
    dev.chhun.hospitalcompare: debug
