# 단발 수집 프로세스. 웹 서버 없이 수집만 하고 종료한다.
spring:
  main:
    web-application-type: none

# 심평원 API는 collector만 호출한다. api 서버는 서비스 키 없이 뜬다.
hira:
  base-url: https://apis.data.go.kr/B551182
  # 공공데이터포털 일반 인증키(Decoding). 클라이언트가 인코딩하므로 Encoding 키를 넣으면 이중 인코딩된다.
  service-key: ${HIRA_SERVICE_KEY}
  # 응답이 오지 않으면 무한정 기다리지 않는다.
  connect-timeout: 3s
  read-timeout: 10s
  # 병원정보서비스 호출 관문. 초당 한도 값은 공개되지 않아 보수적으로 시작하고 실측으로 조정한다.
  max-concurrency: 4
  requests-per-second: 5
  retry:
    max-retries: 3
    initial-delay: 500ms
    max-delay: 5s

collector:
  # 목록 API 한 페이지 요청 크기. 허용 최대값은 실측으로 확인한다.
  num-of-rows: 100
  gate:
    min-count-ratio: 0.8
    max-missing-required-ratio: 0.05
