# 모든 프로파일 공통. 실행 시 api 또는 collector 중 하나를 고르고, 로컬에서는 local을 함께 켠다.
# ${...} 값은 환경변수로만 주입한다(로컬: 인텔리제이 Run Configuration, 배포: GitHub Secrets).
spring:
  application:
    name: hospital-compare
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 스키마의 유일한 기준은 엔티티다(Flyway·schema.sql 없음).
    hibernate:
      ddl-auto: update
    open-in-view: false

hira:
  # 공공데이터포털 일반 인증키(Decoding). 클라이언트가 인코딩하므로 Encoding 키를 넣으면 이중 인코딩된다.
  service-key: ${HIRA_SERVICE_KEY}
