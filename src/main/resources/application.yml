# 모든 프로파일 공통. 실행 시 api 또는 collector 중 하나를 고르고, 로컬에서는 local을 함께 켠다.
# ${...} 값은 환경변수로만 주입한다(로컬: 인텔리제이 Run Configuration, 배포: GitHub Secrets).
spring:
  application:
    name: hospital-compare
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        # JDBC batch를 다중 행 INSERT 하나로 묶어 보낸다. 끄면 Connector/J가 행마다 따로 보낸다.
        rewriteBatchedStatements: true
  jpa:
    # 스키마의 유일한 기준은 엔티티다(Flyway·schema.sql 없음).
    hibernate:
      ddl-auto: update
    open-in-view: false

# 병원급 종별(상급종합·종합병원·병원·요양병원·정신병원·치과병원·한방병원). 상세정보 수집 대상이자 화면의 "병원급" 판단 기준.
# 따옴표가 없으면 01이 숫자 1로 읽힌다.
hospital:
  level-cl-codes: ["01", "11", "21", "28", "29", "41", "92"]
