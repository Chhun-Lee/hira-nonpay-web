services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=${DB_NAME:?.env에 DB_NAME을 설정하세요}'
      - 'MYSQL_USER=${DB_USERNAME:?.env에 DB_USERNAME을 설정하세요}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}'
      - 'MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?.env에 DB_ROOT_PASSWORD를 설정하세요}'
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
