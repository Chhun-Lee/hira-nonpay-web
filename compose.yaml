services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=${DB_NAME:-hospital_compare}'
      - 'MYSQL_USER=${DB_USERNAME:-hospital}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD:?환경변수 DB_PASSWORD를 설정하세요}'
      - 'MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?환경변수 DB_ROOT_PASSWORD를 설정하세요}'
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
